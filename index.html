<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نافذة النجاح العالمية</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #008cff, #003b88);
    color: white;
    text-align: center;
}

.header {
    padding: 30px;
}

.school {
    font-size: 30px;
    font-weight: bold;
}

.alex {
    background: white;
    color: #0066cc;
    width: 80%;
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 20px;
    font-size: 25px;
    font-weight: bold;
}

.students {
    width: 90%;
    max-width: 600px;
    margin: auto;
}

.student {
    width: 100%;
    padding: 18px;
    margin: 8px 0;
    border: none;
    border-radius: 15px;
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.student:hover {
    background: rgba(255,255,255,0.35);
}

/* الصورة */

#photoBox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.photoContent {
    background: white;
    color: #0066cc;
    padding: 20px;
    border-radius: 20px;
    width: 85%;
    max-width: 400px;
}

.photoContent img {
    width: 100%;
    border-radius: 15px;
}

.close {
    font-size: 30px;
    cursor: pointer;
    color: black;
}

</style>
</head>

<body>

<div class="header">
    <div class="school">
        🏫 نافذة النجاح العالمية
    </div>

    <p>قائمة الطلاب</p>
</div>


<div class="alex">
    ⭐ Alex : أحمد جلاب ⭐
</div>


<div class="students">

    <button class="student"
    onclick="showPhoto('عبدالله أنور','images/IMG_5602.jpeg')">
        1. عبدالله أنور
    </button>


    <button class="student"
    onclick="showPhoto('عبدالله عمر','images/IMG_5606.jpeg')">
        2. عبدالله عمر
    </button>


    <button class="student"
    onclick="showPhoto('رواد عسكر','images/62978692-40ec-4d90-8d50-f0de86eb948e.jpeg')">
        3. رواد عسكر
    </button>


    <button class="student"
    onclick="showPhoto('بشار موسى','')">
        4. بشار موسى
    </button>


    <button class="student"
    onclick="showPhoto('يحيى','images/d6123e4c-24b7-4226-bc4f-ebb2e859296a.jpeg')">
        5. يحيى
    </button>


    <button class="student"
    onclick="showPhoto('حزام','')">
        6. حزام
    </button>


    <button class="student"
    onclick="showPhoto('محمد فاتح','')">
        7. محمد فاتح
    </button>


    <button class="student"
    onclick="showPhoto('ابو بكر براهيم','')">
        8. ابو بكر براهيم
    </button>


    <button class="student"
    onclick="showPhoto('احمد فيصل','')">
        9. احمد فيصل
    </button>

</div>


<!-- نافذة الصورة -->

<div id="photoBox" onclick="closePhoto()">

    <div class="photoContent" onclick="event.stopPropagation()">

        <span class="close" onclick="closePhoto()">×</span>

        <h2 id="name"></h2>

        <img id="photo" src="">

    </div>

</div>


<script>

function showPhoto(name, image) {

    document.getElementById("name").innerText = name;

    if (image === "") {
        document.getElementById("photo").style.display = "none";
    } else {
        document.getElementById("photo").style.display = "block";
        document.getElementById("photo").src = image;
    }

    document.getElementById("photoBox").style.display = "flex";
}


function closePhoto() {

    document.getElementById("photoBox").style.display = "none";

}

</script>

</body>
</html>
