<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10A - نافذة النجاح العالمية</title>
<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:linear-gradient(
120deg,
#001aff,
#00c6ff,
#7b00ff,
#ff00c8,
#ff0066,
#ff8a00,
#00ffcc,
#0066ff
);
background-size:600% 600%;
animation:bg 12s ease infinite;
}
@keyframes bg{
0%{background-position:0% 50%}
25%{background-position:50% 100%}
50%{background-position:100% 50%}
75%{background-position:50% 0%}
100%{background-position:0% 50%}
}
h1{
margin-top:35px;
font-size:38px;
}
.school{
font-size:22px;
margin-bottom:25px;
}
button{
display:block;
width:85%;
margin:10px auto;
padding:17px;
border:0;
border-radius:15px;
background:#ffffff30;
color:white;
font-size:20px;
cursor:pointer;
}
button:hover{
background:#ffffff55;
}
#pop{
display:none;
position:fixed;
inset:0;
background:#000c;
align-items:center;
justify-content:center;
}
.box{
background:white;
padding:20px;
border-radius:20px;
color:#0066cc;
width:80%;
max-width:400px;
}
.box img{
width:100%;
border-radius:15px;
}
.close{
font-size:30px;
cursor:pointer;
}
.founder{
margin:40px auto 20px;
padding:20px;
width:85%;
max-width:550px;
background:#ffffff22;
border:1px solid #ffffff55;
border-radius:20px;
font-size:22px;
font-weight:bold;
}
</style>
</head>
<body>
<h1>10A</h1>
<div class="school">
🏫 نافذة النجاح العالمية
</div>
<button onclick="show('عبدالله أنور','images/IMG_5602.jpeg')">
1. عبدالله أنور
</button>
<button onclick="show('عبدالله عمر','images/IMG_5606.jpeg')">
2. عبدالله عمر
</button>
<button onclick="show('بشار موسى','')">
3. بشار موسى
</button>
<button onclick="show('يحيى','images/d6123e4c-24b7-4226-bc4f-ebb2e859296a.jpeg')">
4. يحيى
</button>
<button onclick="show('حزام','')">
5. حزام
</button>
<button onclick="show('ابو بكر براهيم','')">
6. ابو بكر براهيم
</button>
<button onclick="show('احمد فيصل','')">
7. احمد فيصل
</button>
<div id="pop" onclick="closePop()">
<div class="box" onclick="event.stopPropagation()">
<div class="close" onclick="closePop()">✕</div>
<h2 id="name"></h2>
<img id="pic">
</div>
</div>
<div class="founder">
مؤسس الموقع<br><br>
👑 أحمد جلاب<br>
⭐ Alex
</div>
<script>
function show(n,p){
document.getElementById("name").innerText=n;
document.getElementById("pic").src=p;
document.getElementById("pop").style.display="flex";
}
function closePop(){
document.getElementById("pop").style.display="none";
}
</script>
</body>
</html>
