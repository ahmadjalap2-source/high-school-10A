<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نافذة النجاح العالمية</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0077ff, #003b8f);
            color: white;
            text-align: center;
        }

        .header {
            padding: 35px 20px;
            background: rgba(0, 0, 0, 0.2);
        }

        .school {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .welcome {
            font-size: 20px;
        }

        .alex {
            margin: 25px auto;
            padding: 18px;
            width: 80%;
            max-width: 500px;
            background: white;
            color: #0066cc;
            border-radius: 20px;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .students {
            width: 85%;
            max-width: 600px;
            margin: 30px auto;
        }

        .student {
            background: rgba(255, 255, 255, 0.15);
            margin: 12px 0;
            padding: 18px;
            border-radius: 15px;
            font-size: 21px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .number {
            font-weight: bold;
            margin-left: 10px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="school">🏫 نافذة النجاح العالمية</div>
        <div class="welcome">قائمة الطلاب</div>
    </div>

    <div class="alex">
        ⭐ alex : أحمد جلاب ⭐
    </div>

    <div class="students">

        <div class="student">
            <span class="number">1.</span> عبدالله انور
        </div>

        <div class="student">
            <span class="number">2.</span> عبدالله عمر
        </div>

        <div class="student">
            <span class="number">3.</span> رواد عسكر
        </div>

        <div class="student">
            <span class="number">4.</span> بشار موسى
        </div>

        <div class="student">
            <span class="number">5.</span> يحيى
        </div>

        <div class="student">
            <span class="number">6.</span> حزام
        </div>

        <div class="student">
            <span class="number">7.</span> محمد فاتح
        </div>

        <div class="student">
            <span class="number">8.</span> ابو بكر براهيم
        </div>

        <div class="student">
            <span class="number">9.</span> احمد فيصل
        </div>

    </div>

    <footer>
        © 2026 نافذة النجاح العالمية
    </footer>

</body>
</html>
