<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نافذة النجاح العالمية</title>
<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:linear-gradient(45deg,#0066ff,#00c6ff,#003b88);
background-size:400% 400%;
animation:bg 8s infinite;
}
@keyframes bg{
0%{background-position:0 50%}
50%{background-position:100% 50%}
100%{background-position:0 50%}
}
h1{margin-top:35px}
.alex{
background:white;
color:#06c;
padding:18px;
margin:25px auto;
width:80%;
border-radius:20px;
font-size:24px;
font-weight:bold;
}
button{
display:block;
width:85%;
margin:10px auto;
padding:16px;
border:0;
border-radius:15px;
background:#ffffff33;
color:white;
font-size:20px;
}
#pop{
display:none;
position:fixed;
inset:0;
background:#000c;
align-items:center;
justify-content:center;
}
.box{
background:white;
padding:20px;
border-radius:20px;
color:#06c;
width:80%;
}
.box img{
width:100%;
border-radius:15px;
}
</style>
</head>
<body>
<h1>🏫 نافذة النجاح العالمية</h1>
<div class="alex">⭐ Alex : أحمد جلاب ⭐</div>
<button onclick="show('عبدالله أنور','images/IMG_5602.jpeg')">1. عبدالله أنور</button>
<button onclick="show('عبدالله عمر','images/IMG_5606.jpeg')">2. عبدالله عمر</button>
<button onclick="show('بشار موسى','')">3. بشار موسى</button>
<button onclick="show('يحيى','images/d6123e4c-24b7-4226-bc4f-ebb2e859296a.jpeg')">4. يحيى</button>
<button onclick="show('حزام','')">5. حزام</button>
<button onclick="show('ابو بكر براهيم','')">6. ابو بكر براهيم</button>
<button onclick="show('احمد فيصل','')">7. احمد فيصل</button>
<div id="pop" onclick="this.style.display='none'">
<div class="box" onclick="event.stopPropagation()">
<h2 id="name"></h2>
<img id="pic">
</div>
</div>
<script>
function show(n,p){
document.getElementById("name").innerText=n;
document.getElementById("pic").src=p;
document.getElementById("pop").style.display="flex";
}
</script>
</body>
</html>
