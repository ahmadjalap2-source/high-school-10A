<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10A - Success International School</title>
<style>
*{
box-sizing:border-box;
}
body{
margin:0;
font-family:Arial,sans-serif;
text-align:center;
color:white;
background:linear-gradient(
120deg,
#001aff,
#00c6ff,
#7b00ff,
#ff00c8,
#ff0066,
#ff8a00,
#00ffcc,
#0066ff
);
background-size:600% 600%;
animation:bg 12s ease infinite;
}
@keyframes bg{
0%{background-position:0% 50%}
25%{background-position:50% 100%}
50%{background-position:100% 50%}
75%{background-position:50% 0%}
100%{background-position:0% 50%}
}
h1{
margin-top:35px;
font-size:40px;
}
.school{
font-size:24px;
margin-bottom:25px;
font-weight:bold;
}
button{
display:block;
width:85%;
margin:10px auto;
padding:17px;
border:0;
border-radius:15px;
background:#ffffff30;
color:white;
font-size:20px;
cursor:pointer;
transition:0.2s;
}
button:hover{
background:#ffffff55;
transform:scale(1.02);
}
#pop{
display:none;
position:fixed;
inset:0;
background:#000c;
align-items:center;
justify-content:center;
z-index:999;
}
.box{
background:white;
padding:20px;
border-radius:20px;
color:#0066cc;
width:80%;
max-width:400px;
}
.box img{
width:100%;
border-radius:15px;
}
.close{
font-size:30px;
cursor:pointer;
margin-bottom:10px;
}
.founder{
margin:40px auto 25px;
padding:20px;
width:85%;
max-width:550px;
background:#ffffff22;
border:1px solid #ffffff55;
border-radius:20px;
font-size:22px;
font-weight:bold;
}
</style>
</head>
<body>
<h1>10A</h1>
<div class="school">
🏫 Success International School
</div>
<button onclick="show('Abdullah Anwar','images/IMG_5602.jpeg')">
1. Abdullah Anwar
</button>
<button onclick="show('Abdullah Omar','images/IMG_5606.jpeg')">
2. Abdullah Omar
</button>
<button onclick="show('Bashar Musa','')">
3. Bashar Musa
</button>
<button onclick="show('Yahya','images/d6123e4c-24b7-4226-bc4f-ebb2e859296a.jpeg')">
4. Yahya
</button>
<button onclick="show('Hizam','')">
5. Hizam
</button>
<button onclick="show('Abu Bakr Ibrahim','')">
6. Abu Bakr Ibrahim
</button>
<button onclick="show('Ahmed Faisal','')">
7. Ahmed Faisal
</button>
<div id="pop" onclick="closePop()">
<div class="box" onclick="event.stopPropagation()">
<div class="close" onclick="closePop()">✕</div>
<h2 id="name"></h2>
<img id="pic">
</div>
</div>
<div class="founder">
👑 Website Founder
<br><br>
Ahmed Jallab
<br>
⭐ Alex
</div>
<script>
function show(name,image){
if(!image){
alert("No photo available for this student yet.");
return;
}
document.getElementById("name").innerText=name;
document.getElementById("pic").src=image;
document.getElementById("pop").style.display="flex";
}
function closePop(){
document.getElementById("pop").style.display="none";
}
</script>
</body>
</html>
