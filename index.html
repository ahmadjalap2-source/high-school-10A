<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نافذة النجاح العالمية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #008cff, #003b88);
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        .header {
            padding: 35px 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .school-name {
            font-size: 32px;
            font-weight: bold;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 18px;
        }

        .alex {
            width: 90%;
            max-width: 550px;
            margin: 25px auto;
            padding: 20px;
            background: white;
            color: #0066cc;
            border-radius: 22px;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .students {
            width: 90%;
            max-width: 650px;
            margin: 25px auto;
        }

        .student {
            width: 100%;
            margin: 10px 0;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.16);
            color: white;
            font-size: 21px;
            cursor: pointer;
            transition: 0.25s;
        }

        .student:hover {
            transform: scale(1.03);
            background: rgba(255,255,255,0.30);
        }

        .number {
            font-weight: bold;
            margin-left: 8px;
        }

        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .popup-content {
            position: relative;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            background: white;
            color: #005bb5;
            border-radius: 25px;
        }

        .popup-content h2 {
            margin-top: 5px;
        }

        .popup-content img {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 18px;
            margin-top: 10px;
        }

        .close {
            position: absolute;
            left: 15px;
            top: 8px;
            font-size: 32px;
            color: #333;
            cursor: pointer;
        }

        footer {
            margin-top: 35px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="school-name">
            🏫 نافذة النجاح العالمية
        </div>

        <div class="subtitle">
            قائمة الطلاب
        </div>
    </div>


    <div class="alex">
        ⭐ Alex : أحمد جلاب ⭐
    </div>


    <div class="students">

        <!-- عبدالله أنور -->
        <button class="student"
            onclick="showStudent('عبدالله أنور', 'images/IMG_5602.jpeg')">

            <span class="number">1.</span>
            عبدالله أنور

        </button>


        <!-- عبدالله عمر -->
        <button class="student"
            onclick="showStudent('عبدالله عمر', 'images/IMG_5606.jpeg')">

            <span class="number">2.</span>
            عبدالله عمر

        </button>


        <!-- رواد عسكر -->
        <button class="student"
            onclick="showStudent('رواد عسكر', 'images/62978692-40ec-4d90-8d50-f0de86eb948e.jpeg')">

            <span class="number">3.</span>
            رواد عسكر

        </button>


        <!-- بشار موسى -->
        <button class="student"
            onclick="showStudent('بشار موسى', '')">

            <span class="number">4.</span>
            بشار موسى

        </button>


        <!-- يحيى -->
        <button class="student"
            onclick="showStudent('يحيى', 'images/d6123e4c-24b7-4226-bc4f-ebb2e859296a.jpeg')">

            <span class="number">5.</span>
            يحيى

        </button>


        <!-- حزام -->
        <button class="student"
            onclick="showStudent('حزام', '')">

            <span class="number">6.</span>
            حزام

        </button>


        <!-- محمد فاتح -->
        <button class="student"
            onclick="showStudent('محمد فاتح', '')">

            <span class="number">7.</span>
            محمد فاتح

        </button>


        <!-- ابو بكر براهيم -->
        <button class="student"
            onclick="showStudent('ابو بكر براهيم', '')">

            <span class="number">8.</span>
            ابو بكر براهيم

        </button>


        <!-- احمد فيصل -->
        <button class="student"
            onclick="showStudent('احمد فيصل', '')">

            <span class="number">9.</span>
            احمد فيصل

        </button>

    </div>


    <!-- نافذة الصورة -->

    <div id="popup"
         class="popup"
         onclick="closePopup()">

        <div class="popup-content"
             onclick="event.stopPropagation()">

            <span class="close"
                  onclick="closePopup()">×</span>

            <h2 id="studentName"></h2>

            <img id="studentImage"
                 src=""
                 alt="صورة الطالب">

        </div>

    </div>


    <footer>
        © 2026 نافذة النجاح العالمية
    </footer>


    <script>

        function showStudent(name, image) {

            document.getElementById("studentName").textContent = name;

            if (image !== "") {
                document.getElementById("studentImage").src = image;
                document.getElementById("studentImage").style.display = "block";
            } else {
                document.getElementById("studentImage").style.display = "none";
            }

            document.getElementById("popup").style.display = "flex";
        }


        function closePopup() {

            document.getElementById("popup").style.display = "none";

        }

    </script>

</body>

</html>
